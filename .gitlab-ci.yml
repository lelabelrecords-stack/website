stages:
  - build
  - validate
  - test
  - perf

variables:
  NODE_IMAGE: "node:20-alpine"
  NODE_IMAGE_FULL: "node:22-bookworm"  # vitest 5 + navigateur exigent Node >= 22
  BUILD_OUTPUT_DIR: "dist"
  PRODUCTION_BRANCH: "main"
  CF_PAGES_PROJECT_NAME: "website"

build:
  stage: build
  image: $NODE_IMAGE
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - $BUILD_OUTPUT_DIR/

audit:
  stage: validate
  image: $NODE_IMAGE
  script:
    - npm ci --no-audit --no-fund
    # bloquant : aucune vulnérabilité dans les dépendances de production
    - npm audit --omit=dev --audit-level=low
    # informatif : audit complet (dev inclus, ex. chaîne test-runner)
    - npm audit || true

budget:
  stage: validate
  image: $NODE_IMAGE
  needs:
    - build
  script:
    - node scripts/budget.mjs

validate:
  stage: validate
  image: $NODE_IMAGE
  needs:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == $PRODUCTION_BRANCH
  script:
    - test -f "$BUILD_OUTPUT_DIR/index.html"
    - test -f "$BUILD_OUTPUT_DIR/favicon.svg"
    - test -f "$BUILD_OUTPUT_DIR/_redirects"
    - test -f "$BUILD_OUTPUT_DIR/.well-known/security.txt"
    - test -f "$BUILD_OUTPUT_DIR/assets/og-image.png"
    - test -f "$BUILD_OUTPUT_DIR/vcard/index.html"
    - test -f "$BUILD_OUTPUT_DIR/vcard/christophe-bonnici.vcf"
    - test -f "$BUILD_OUTPUT_DIR/vcard/roxane-gire.vcf"
    - 'echo "dist/ OK - deploiement natif Cloudflare Pages (projet $CF_PAGES_PROJECT_NAME, branche $PRODUCTION_BRANCH, output $BUILD_OUTPUT_DIR)."'

ds-tests:
  stage: test
  image: $NODE_IMAGE_FULL
  rules:
    - if: $CI_COMMIT_BRANCH == $PRODUCTION_BRANCH
  script:
    - npm ci --no-audit --no-fund
    - npx playwright install-deps chromium > /dev/null
    - npx playwright install chromium
    - BIN="$(find "$HOME/.cache/ms-playwright" -type f -name 'chrome*' | head -1)"
    - if ldd "$BIN" 2>/dev/null | grep -q 'not found'; then echo "libs manquantes:"; ldd "$BIN" | grep 'not found'; exit 1; fi
    - npm run test:storybook

lighthouse:
  stage: perf
  image: $NODE_IMAGE_FULL
  needs:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == $PRODUCTION_BRANCH
  script:
    - npm ci --no-audit --no-fund
    - npx playwright install-deps chromium > /dev/null
    - npx playwright install chromium > /dev/null
    - BIN="$(find "$HOME/.cache/ms-playwright" -type f -name 'chrome*' | head -1)"
    - if ldd "$BIN" 2>/dev/null | grep -q 'not found'; then echo "libs manquantes:"; ldd "$BIN" | grep 'not found'; exit 1; fi
    - npm run test:lh
  artifacts:
    paths:
      - lh-report.json
