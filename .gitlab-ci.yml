stages:
  - build
  - validate

variables:
  CF_PAGES_PROJECT_NAME: "website"

build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/

validate:
  stage: validate
  image: node:20-alpine
  needs:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - test -f dist/index.html
    - test -f dist/favicon.svg
    - test -f dist/_redirects
    - echo "dist/ OK. Déploiement réel assuré par le build natif Cloudflare Pages du projet '$CF_PAGES_PROJECT_NAME' (connecté à ce repo GitLab, deploy: npx wrangler deploy + wrangler.jsonc)."
