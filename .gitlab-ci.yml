stages:
  - build
  - validate
  - test
  - perf

variables:
  NODE_IMAGE: "node:20-alpine"
  NODE_IMAGE_FULL: "node:20-bookworm"
  BUILD_OUTPUT_DIR: "dist"
  PRODUCTION_BRANCH: "main"
  CF_PAGES_PROJECT_NAME: "website"

build:
  stage: build
  image: $NODE_IMAGE
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - $BUILD_OUTPUT_DIR/

audit:
  stage: validate
  image: $NODE_IMAGE
  script:
    - npm ci --no-audit --no-fund
    # bloquant : aucune vulnérabilité dans les dépendances de production
    - npm audit --omit=dev --audit-level=low
    # informatif : audit complet (dev inclus, ex. chaîne test-runner)
    - npm audit || true

budget:
  stage: validate
  image: $NODE_IMAGE
  needs:
    - build
  script:
    - node scripts/budget.mjs

validate:
  stage: validate
  image: $NODE_IMAGE
  needs:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == $PRODUCTION_BRANCH
  script:
    - test -f "$BUILD_OUTPUT_DIR/index.html"
    - test -f "$BUILD_OUTPUT_DIR/favicon.svg"
    - test -f "$BUILD_OUTPUT_DIR/_redirects"
    - test -f "$BUILD_OUTPUT_DIR/.well-known/security.txt"
    - test -f "$BUILD_OUTPUT_DIR/assets/og-image.png"
    - 'echo "dist/ OK - deploiement natif Cloudflare Pages (projet $CF_PAGES_PROJECT_NAME, branche $PRODUCTION_BRANCH, output $BUILD_OUTPUT_DIR)."'

ds-tests:
  stage: test
  image: $NODE_IMAGE_FULL
  rules:
    - if: $CI_COMMIT_BRANCH == $PRODUCTION_BRANCH
  script:
    - npm ci --no-audit --no-fund
    - npx playwright install --with-deps chromium
    - npm run test:storybook

lighthouse:
  stage: perf
  image: $NODE_IMAGE_FULL
  needs:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == $PRODUCTION_BRANCH
  script:
    - npm ci --no-audit --no-fund
    - apt-get update -qq && apt-get install -y -qq libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 > /dev/null
    - npx @puppeteer/browsers install chrome@stable --path /tmp/chrome-cache > /dev/null
    - export CHROME_PATH="$(find /tmp/chrome-cache -name chrome -type f | head -1)"
    - node scripts/serve-dist.mjs dist 8080 &
    - sleep 1
    - npx lighthouse http://127.0.0.1:8080/ --only-categories=performance,accessibility,best-practices,seo --budget-path=lighthouse-budget.json --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh-report.json --quiet
  artifacts:
    paths:
      - lh-report.json
