stages:
  - build
  - deploy

variables:
  CF_PAGES_PROJECT_NAME: "website"

build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/

deploy:
  stage: deploy
  image: node:20-alpine
  needs:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - npm install --no-save wrangler
    - npx wrangler pages deploy dist --project-name="$CF_PAGES_PROJECT_NAME" --branch=main
  environment:
    name: production
    url: https://$CF_PAGES_PROJECT_NAME.pages.dev
